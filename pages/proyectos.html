      crossorigin="anonymous"
    />

  </head>
  <body>
    <header class="header">
      <a href="../index.html" class="logo">
        <img
          src="../recursos/imagenes/logos/logo-empresa.png"
          alt="Logo de la empresa"
        />
      </a>
      <nav class="navbar navbar-expand-md bg-transparent navbar-transparent">
        <div class="container">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="sobre-mi.html">Sobre mí</a>

                <a
                  class="nav-link active"
                  aria-current="page"
                  href="proyectos.html"
                  >Proyectos</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="servicios.html">FAQ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="main">
      <h1>Proyectos</h1>
      <section
        class="section-proyectos"
        id="section-proyectos"
        data-aos="fade-up"
        data-aos-easing="linear"
        data-aos-duration="1000"
      >
        <h2>Algunos de mis proyectos</h2>
        <div
          id="carouselExampleAutoplaying"
          class="carousel slide"
          data-bs-ride="carousel"
        >
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleAutoplaying"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleAutoplaying"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleAutoplaying"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleAutoplaying"
              data-bs-slide-to="3"
              aria-label="Slide 4"
            ></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="4000">
              <img
                src="../recursos/imagenes/aplicaciones/app-gestionpro.jpg"
                class="d-block w-100"
                alt="Imagen de aplicación GestionPro"
              />
            </div>
            <div class="carousel-item" data-bs-interval="4000">
              <img
                src="../recursos/imagenes/aplicaciones/app-turnosya.jpg"
                class="d-block w-100"
                alt="Imagen de aplicación TurnosYa"
              />
            </div>
            <div class="carousel-item" data-bs-interval="4000">
              <img
                src="../recursos/imagenes/aplicaciones/app-logitrack.jpg"
                class="d-block w-100"
                alt="Imagen de aplicación LogiTrack"
              />
            </div>
            <div class="carousel-item" data-bs-interval="4000">
              <img
                src="../recursos/imagenes/aplicaciones/app-clientflow.jpg"
                class="d-block w-100"
                alt="Imagen de aplicación ClientFlow"
              />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </section>
    </main>

          alt="Logo de instagram"
        />
      </a>
      <a
        href="https://wa.me/5493516152780"

        target="_blank"

        />
      </a>

      AOS.init();
    </script>
